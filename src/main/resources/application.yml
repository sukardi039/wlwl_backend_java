server:
  port: ${PORT:8080}
  # The PHP was served under /backend/ by IIS. Keep the same paths so the Vue
  # base URL does not change at cutover.
  servlet:
    context-path: /

spring:
  application:
    name: wlwl-backend

  datasource:
    # utf8mb3 matters: every table is CHARSET=utf8mb3, so connecting as utf8mb4
    # changes how 4-byte characters are handled versus the PHP (which ran with
    # SET NAMES utf8 == utf8mb3). Match the original collation deliberately.
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:wlwl}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionCollation=utf8mb3_general_ci&serverTimezone=${DB_TZ:Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      # Long drill JSON payloads live in drilldetail.content (longtext).
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048

  jackson:
    default-property-inclusion: always   # PHP includes nulls in json_encode output
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      # Both the new image API and legacy images/upload.php accept multipart. PHP defaults are
      # upload_max_filesize=2M / post_max_size=8M, and the Vue client refuses anything
      # over 1.5 MB before sending. Spring's own default is 1 MB, which would silently
      # start rejecting files PHP accepted — so match PHP, not the framework.
      max-file-size: 2MB
      max-request-size: 8MB

# Shared image storage for /backend/media/images and legacy images/upload.php.
# Empty = read params.fileLocation from the database. Set WLWL_UPLOAD_DIR on Linux
# because that parameter holds a Windows path in production. Use a persistent volume.
wlwl:
  upload:
    dir: ${WLWL_UPLOAD_DIR:}
  # backend/registration.json — the login screen's deployment identity (company,
  # registration numbers, regulator links). The PHP kept this file gitignored, in the
  # webroot, so each deployment supplied its own. Empty = serve the bundled placeholder
  # from src/main/resources; set WLWL_REGISTRATION_FILE to the real file in production.
  registration:
    file: ${WLWL_REGISTRATION_FILE:}

logging:
  level:
    root: INFO
    com.wlwl.backend: DEBUG
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
