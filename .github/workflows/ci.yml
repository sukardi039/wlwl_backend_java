name: build

# The repo is the delivery mechanism: every push is verified, and a pushed tag
# publishes the runnable jar as a GitHub Release asset that can be pulled onto
# the server. No secrets are required — the parity suite runs on in-memory H2.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # needed to create the Release on a tag

jobs:
  verify:
    name: mvn verify (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run the parity suite
        run: mvn -B --no-transfer-progress verify

      - name: Validate the SQL (schema + dev seed parse as MySQL)
        run: |
          python3 -m pip install --quiet sqlglot
          python3 db/tools/check-sql.py

      - name: Cross-check the SQL embedded in Java against the schema
        run: python3 db/tools/check-sql-usage.py

      - name: Self-test db/migrate.sh (no database needed)
        run: ./db/tools/test-migrate.sh

      - name: Self-test the schema-parity comparator (mutation test)
        run: python3 db/tools/check-schema-parity.py --self-test

      # Tier B: the committed condensed dump summary. Fails on any difference;
      # items the summary never states are listed as UNVERIFIED, not as parity.
      - name: Schema parity vs the original database (condensed doc)
        run: python3 db/tools/check-schema-parity.py --allow-unverified

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: wlwl-backend-jar
          path: target/wlwl-backend-*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  release:
    name: attach jar to the release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wlwl-backend-jar
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/wlwl-backend-*.jar
          generate_release_notes: true

  # Keeps the Dockerfile honest. Building it here means a broken base image,
  # a bad COPY path or a dependency that no longer resolves fails CI instead of
  # failing on the server at cutover. The image build skips the test suite
  # (MVN_ARGS default) because `verify` above already ran it — this job is about
  # packaging, not parity.
  docker:
    name: docker image builds and starts
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wlwl-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          # Deliberately starts with NO database: the image must boot anyway and
          # the healthcheck must not depend on MySQL being up.
          docker run -d --name wlwl-ci -p 8080:8080 \
            -e DB_HOST=127.0.0.1 -e DB_PORT=3306 -e WLWL_UPLOAD_DIR=/data/uploads \
            wlwl-backend:ci

          echo "--- runs as non-root ---"
          test "$(docker exec wlwl-ci id -u)" = "10001"

          echo "--- healthcheck ---"
          for i in $(seq 1 40); do
            status="$(docker inspect -f '{{.State.Health.Status}}' wlwl-ci || echo starting)"
            echo "  attempt $i: $status"
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          test "$status" = "healthy"

          echo "--- RPC contract unchanged ---"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:8080/backend/drill -d '{}')
          echo "  POST /backend/drill without restkey -> $code (PHP: empty 200)"
          test "$code" = "200"

          docker logs wlwl-ci | tail -20
          docker rm -f wlwl-ci
